# ==============================================================
# SMART CAMPUS - TEST CONFIGURATION
# ==============================================================
spring.application.name=smart-campus-test
spring.profiles.active=dev

# Test profile enables demo data seeding so integration test suites can run
campus.seed.demodata=true

spring.datasource.url=jdbc:h2:mem:smart_campus_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

logging.level.app=WARN
logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN
