# ==============================================================
# SMART CAMPUS MANAGEMENT SYSTEM - APPLICATION CONFIGURATION
# ==============================================================
spring.application.name=smart-campus-backend
server.port=${PORT:${SERVER_PORT:8081}}

# Active Profile:
# - 'mysql' for local/production MySQL 8+ server
# - 'dev' for fast zero-configuration in-memory H2 development
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Campus Data Seeding:
# Set to false to run in clean mode (no fake students, faculty, marks or notices)
campus.seed.demodata=${CAMPUS_SEED_DEMODATA:false}

# Configurable Attendance Shortage Warning Threshold (Default: 75.0%)
campus.attendance.warning-threshold=${CAMPUS_ATTENDANCE_THRESHOLD:75.0}

# Thymeleaf Template Engine Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# File Upload Multipart limits for study materials and submissions
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=30MB

# Logging Configuration
logging.level.app=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=DEBUG
