<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Materials | Smart Campus</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="app-layout">
    <div th:replace="~{layout/fragments :: faculty-sidebar}"></div>

    <div class="main-wrapper">
        <div th:replace="~{layout/fragments :: topbar('Study Materials & Courseware Repository')}"></div>

        <main class="content-body">
            <div th:if="${successMessage}" class="alert-banner alert-success" th:text="${successMessage}"></div>
            <div th:if="${errorMessage}" class="alert-banner alert-error" th:text="${errorMessage}"></div>

            <!-- Upload Material Form -->
            <div class="form-panel">
                <h2 style="font-size: 1.1rem; margin-bottom: 1rem;">Upload Course Material</h2>
                <form th:action="@{/faculty/materials/upload}" method="post">
                    <div class="form-grid">
                        <div class="form-group" style="grid-column: span 2;">
                            <label class="form-label">Material Title</label>
                            <input type="text" name="title" class="form-control" placeholder="e.g. Chapter 4: Deadlock Avoidance Algorithms" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Subject</label>
                            <select name="subjectId" class="form-control" required>
                                <option th:each="s : ${subjects}" th:value="${s.id}" th:text="${s.subjectCode + ' - ' + s.subjectName}"></option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label class="form-label">File Type</label>
                            <select name="fileType" class="form-control" required>
                                <option value="PDF">PDF Document</option>
                                <option value="PPTX">PowerPoint Presentation (PPTX)</option>
                                <option value="DOCX">Word Document (DOCX)</option>
                                <option value="IMAGE">Diagram / Schematic Image</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Document Filename</label>
                            <input type="text" name="fileName" class="form-control" placeholder="e.g. CS501_Chapter4_Deadlocks.pdf" required>
                        </div>
                        <div class="form-group" style="grid-column: span 2;">
                            <label class="form-label">Description / Lecture Summary</label>
                            <textarea name="description" class="form-control" rows="3" placeholder="Summary of topics covered in this material..."></textarea>
                        </div>
                    </div>
                    <div style="margin-top: 1.25rem;">
                        <button type="submit" class="btn btn-primary">Upload Material</button>
                    </div>
                </form>
            </div>

            <!-- Materials Table -->
            <div class="table-container">
                <div class="table-header">
                    <h2 class="table-title">Uploaded Course Materials</h2>
                </div>
                <table class="custom-table">
                    <thead>
                        <tr>
                            <th>Subject</th>
                            <th>Title & Description</th>
                            <th>Format</th>
                            <th>Upload Date</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:if="${#lists.isEmpty(materials)}">
                            <td colspan="5" style="text-align: center; color: var(--text-muted); padding: 2rem;">No study materials uploaded yet.</td>
                        </tr>
                        <tr th:each="m : ${materials}">
                            <td><span class="badge badge-muted" th:text="${m.subject.subjectCode}">CS501</span></td>
                            <td>
                                <strong th:text="${m.title}">Title</strong>
                                <p style="font-size: 0.8rem; color: var(--text-secondary); margin-top: 0.25rem;" th:text="${m.description}">Desc...</p>
                            </td>
                            <td><span class="badge badge-info" th:text="${m.fileType}">PDF</span></td>
                            <td style="font-family: var(--font-mono);" th:text="${#temporals.format(m.uploadDate, 'dd MMM yyyy')}">Date</td>
                            <td>
                                <span class="badge badge-success" th:text="${m.fileName}">file.pdf</span>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>
</div>
</body>
</html>
