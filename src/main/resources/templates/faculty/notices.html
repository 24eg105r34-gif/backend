<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Academic Announcements | Smart Campus</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="app-layout">
    <div th:replace="~{layout/fragments :: faculty-sidebar}"></div>

    <div class="main-wrapper">
        <div th:replace="~{layout/fragments :: topbar('Academic Notices & Class Circulars')}"></div>

        <main class="content-body">
            <div th:if="${successMessage}" class="alert-banner alert-success" th:text="${successMessage}"></div>
            <div th:if="${errorMessage}" class="alert-banner alert-error" th:text="${errorMessage}"></div>

            <!-- Publish Announcement Form -->
            <div class="form-panel">
                <h2 style="font-size: 1.1rem; margin-bottom: 1rem;">Post Academic Announcement</h2>
                <form th:action="@{/faculty/notices/publish}" method="post">
                    <div class="form-grid">
                        <div class="form-group" style="grid-column: span 2;">
                            <label class="form-label">Announcement Title</label>
                            <input type="text" name="title" class="form-control" placeholder="e.g. Lab Session 4 Rescheduled to Thursday" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Category</label>
                            <select name="category" class="form-control" required>
                                <option value="Academic">Academic</option>
                                <option value="Examination">Examination</option>
                                <option value="General">General</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Expiry Date (Optional)</label>
                            <input type="date" name="expiryDate" class="form-control">
                        </div>
                        <div class="form-group" style="grid-column: span 2;">
                            <label class="form-label">Announcement Message</label>
                            <textarea name="description" class="form-control" rows="3" placeholder="Provide complete instruction for students..." required></textarea>
                        </div>
                    </div>
                    <div style="margin-top: 1.25rem;">
                        <button type="submit" class="btn btn-primary">Post Announcement</button>
                    </div>
                </form>
            </div>

            <!-- Active Notices -->
            <div class="table-container">
                <div class="table-header">
                    <h2 class="table-title">Recent Campus Announcements</h2>
                </div>
                <table class="custom-table">
                    <thead>
                        <tr>
                            <th>Published</th>
                            <th>Category</th>
                            <th>Title & Details</th>
                            <th>Issued By</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="n : ${notices}">
                            <td style="font-family: var(--font-mono);" th:text="${n.publishedDate}">2026-10-01</td>
                            <td><span class="badge badge-info" th:text="${n.category}">Academic</span></td>
                            <td>
                                <strong th:text="${n.title}">Title</strong>
                                <p style="font-size: 0.8rem; color: var(--text-secondary); margin-top: 0.25rem;" th:text="${n.description}">Desc...</p>
                            </td>
                            <td th:text="${n.createdBy}">Instructor</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>
</div>
</body>
</html>
