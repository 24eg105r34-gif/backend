<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grievance & Complaint Management | Smart Campus</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="app-layout">
    <div th:replace="~{layout/fragments :: admin-sidebar}"></div>

    <div class="main-wrapper">
        <div th:replace="~{layout/fragments :: topbar('Student Grievance & Complaint Redressal')}"></div>

        <main class="content-body">
            <div th:if="${successMessage}" class="alert-banner alert-success" th:text="${successMessage}"></div>
            <div th:if="${errorMessage}" class="alert-banner alert-error" th:text="${errorMessage}"></div>

            <!-- Complaint Filter Toolbar -->
            <div class="form-panel" style="margin-bottom: 1.5rem; padding: 1.25rem;">
                <form th:action="@{/admin/complaints}" method="get" style="display: flex; flex-wrap: wrap; gap: 1rem; align-items: flex-end;">
                    <div class="form-group" style="margin-bottom: 0; min-width: 180px;">
                        <label class="form-label">Status Filter</label>
                        <select name="status" class="form-control">
                            <option value="">All Statuses</option>
                            <option th:each="s : ${statuses}" th:value="${s}" th:text="${s}" th:selected="${selectedStatus != null && selectedStatus == s}"></option>
                        </select>
                    </div>
                    <div class="form-group" style="margin-bottom: 0; min-width: 180px;">
                        <label class="form-label">Category Filter</label>
                        <select name="category" class="form-control">
                            <option value="">All Categories</option>
                            <option th:each="cat : ${categories}" th:value="${cat}" th:text="${cat}" th:selected="${selectedCategory != null && selectedCategory == cat}"></option>
                        </select>
                    </div>
                    <div style="display: flex; gap: 0.5rem;">
                        <button type="submit" class="btn btn-primary">Apply Filter</button>
                        <a href="/admin/complaints" class="btn btn-outline">Reset</a>
                    </div>
                </form>
            </div>

            <div class="table-container">
                <div class="table-header">
                    <h2 class="table-title">
                        Complaint Tickets (<span th:text="${#lists.size(complaints)}">0</span>)
                        <span th:if="${selectedStatus != null}" class="badge badge-info" th:text="'Status: ' + ${selectedStatus}"></span>
                        <span th:if="${selectedCategory != null}" class="badge badge-muted" th:text="'Category: ' + ${selectedCategory}"></span>
                    </h2>
                </div>
                <table class="custom-table">
                    <thead>
                        <tr>
                            <th>Ticket</th>
                            <th>Student</th>
                            <th>Category</th>
                            <th>Issue & Description</th>
                            <th>Status</th>
                            <th>Admin Resolution Action</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:if="${#lists.isEmpty(complaints)}">
                            <td colspan="6" style="text-align: center; color: var(--text-muted); padding: 2rem;">No complaint tickets match the selected filters.</td>
                        </tr>
                        <tr th:each="c : ${complaints}">
                            <td style="font-family: var(--font-mono); font-weight: 700;" th:text="'#TKT-' + ${c.id}">#TKT-1</td>
                            <td>
                                <strong th:text="${c.student.name}">Rahul Verma</strong><br>
                                <small style="color: var(--text-muted);" th:text="${c.student.studentId + ' | ' + c.student.department.departmentCode}">STU-001 | CSE</small>
                            </td>
                            <td><span class="badge badge-muted" th:text="${c.category}">Laboratory</span></td>
                            <td>
                                <strong th:text="${c.subject}">Subject</strong>
                                <p style="font-size: 0.825rem; color: var(--text-secondary); margin-top: 0.25rem;" th:text="${c.description}">Description</p>
                                <div th:if="${c.adminResponse != null}" style="margin-top: 0.5rem; padding: 0.5rem; background: var(--bg-secondary); border-radius: var(--radius-sm); font-size: 0.8rem;">
                                    <strong>Admin Note:</strong> <span th:text="${c.adminResponse}">Response note...</span>
                                    <small th:if="${c.resolvedAt != null}" style="display: block; color: var(--text-muted); font-family: var(--font-mono); margin-top: 0.25rem;"
                                           th:text="'Updated: ' + ${#temporals.format(c.resolvedAt, 'dd MMM yyyy, hh:mm a')}"></small>
                                </div>
                            </td>
                            <td>
                                <span class="badge"
                                      th:classappend="${c.status.name() == 'RESOLVED' ? 'badge-success' : (c.status.name() == 'PENDING' ? 'badge-warning' : (c.status.name() == 'IN_PROGRESS' ? 'badge-info' : 'badge-danger'))}"
                                      th:text="${c.status}">PENDING</span>
                            </td>
                            <td style="min-width: 250px;">
                                <form th:action="@{/admin/complaints/update}" method="post">
                                    <input type="hidden" name="complaintId" th:value="${c.id}">
                                    <div style="display: flex; flex-direction: column; gap: 0.5rem;">
                                        <select name="status" class="form-control" style="font-size: 0.8rem; padding: 0.35rem 0.5rem;">
                                            <option th:each="s : ${statuses}" th:value="${s}" th:text="${s}" th:selected="${s == c.status}"></option>
                                        </select>
                                        <input type="text" name="adminResponse" th:value="${c.adminResponse}" class="form-control" style="font-size: 0.8rem; padding: 0.35rem 0.5rem;" placeholder="Resolution remarks...">
                                        <button type="submit" class="btn btn-primary btn-sm">Update Status & Notify Student</button>
                                    </div>
                                </form>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>
</div>
</body>
</html>
