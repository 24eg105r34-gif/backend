<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subject Management | Smart Campus</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="app-layout">
    <div th:replace="~{layout/fragments :: admin-sidebar}"></div>

    <div class="main-wrapper">
        <div th:replace="~{layout/fragments :: topbar('Curriculum & Course Subjects')}"></div>

        <main class="content-body">
            <div th:if="${successMessage}" class="alert-banner alert-success" th:text="${successMessage}"></div>
            <div th:if="${errorMessage}" class="alert-banner alert-error" th:text="${errorMessage}"></div>

            <!-- Add Subject Form -->
            <div class="form-panel">
                <h2 style="font-size: 1.1rem; margin-bottom: 1rem;">Register Course Subject</h2>
                <form th:action="@{/admin/subjects/add}" method="post">
                    <div class="form-grid">
                        <div class="form-group">
                            <label class="form-label">Subject Code</label>
                            <input type="text" name="subjectCode" class="form-control" placeholder="e.g. CS504" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Subject Name</label>
                            <input type="text" name="subjectName" class="form-control" placeholder="e.g. Compiler Design" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Credits</label>
                            <input type="number" name="credits" class="form-control" min="1" max="10" value="4" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Department</label>
                            <select name="departmentId" class="form-control" required>
                                <option value="">Select Department</option>
                                <option th:each="d : ${departments}" th:value="${d.id}" th:text="${d.departmentCode}"></option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Semester</label>
                            <select name="semester" class="form-control" required>
                                <option value="1">Sem 1</option>
                                <option value="2">Sem 2</option>
                                <option value="3">Sem 3</option>
                                <option value="4">Sem 4</option>
                                <option value="5" selected>Sem 5</option>
                                <option value="6">Sem 6</option>
                                <option value="7">Sem 7</option>
                                <option value="8">Sem 8</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Assign Faculty Instructor</label>
                            <select name="facultyId" class="form-control">
                                <option value="">-- Unassigned --</option>
                                <option th:each="f : ${facultyList}" th:value="${f.id}" th:text="${f.name + ' (' + f.department.departmentCode + ')'}"></option>
                            </select>
                        </div>
                    </div>
                    <div style="margin-top: 1.25rem;">
                        <button type="submit" class="btn btn-primary">Save Subject</button>
                    </div>
                </form>
            </div>

            <!-- Subject Table -->
            <div class="table-container">
                <div class="table-header">
                    <h2 class="table-title">Subject Directory (<span th:text="${#lists.size(subjects)}">0</span>)</h2>
                </div>
                <table class="custom-table">
                    <thead>
                        <tr>
                            <th>Code</th>
                            <th>Subject Name</th>
                            <th>Credits</th>
                            <th>Department</th>
                            <th>Semester</th>
                            <th>Assigned Faculty</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="s : ${subjects}">
                            <td style="font-family: var(--font-mono); font-weight: 700;" th:text="${s.subjectCode}">CS501</td>
                            <td th:text="${s.subjectName}">Operating Systems</td>
                            <td th:text="${s.credits}">4</td>
                            <td><span class="badge badge-muted" th:text="${s.department.departmentCode}">CSE</span></td>
                            <td th:text="'Sem ' + ${s.semester}">Sem 5</td>
                            <td>
                                <span th:if="${s.faculty != null}" th:text="${s.faculty.name}">Prof. Alok Sharma</span>
                                <span th:unless="${s.faculty != null}" class="badge badge-warning">Unassigned</span>
                            </td>
                            <td>
                                <form th:action="@{'/admin/subjects/delete/' + ${s.id}}" method="post" style="display:inline;" onsubmit="return confirm('Confirm deleting subject?');">
                                    <button type="submit" class="btn btn-danger btn-sm">Delete</button>
                                </form>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>
</div>
</body>
</html>
