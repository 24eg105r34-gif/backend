<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notice Board Management | Smart Campus</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="app-layout">
    <div th:replace="~{layout/fragments :: admin-sidebar}"></div>

    <div class="main-wrapper">
        <div th:replace="~{layout/fragments :: topbar('Campus Notice Board & Circulars')}"></div>

        <main class="content-body">
            <div th:if="${successMessage}" class="alert-banner alert-success" th:text="${successMessage}"></div>
            <div th:if="${errorMessage}" class="alert-banner alert-error" th:text="${errorMessage}"></div>

            <!-- Publish Notice Form -->
            <div class="form-panel">
                <h2 style="font-size: 1.1rem; margin-bottom: 1rem;">Publish Campus Circular</h2>
                <form th:action="@{/admin/notices/add}" method="post">
                    <div class="form-grid">
                        <div class="form-group" style="grid-column: span 2;">
                            <label class="form-label">Notice Title</label>
                            <input type="text" name="title" class="form-control" placeholder="e.g. End Semester Examination Time-Table Released" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Category</label>
                            <select name="category" class="form-control" required>
                                <option th:each="c : ${categories}" th:value="${c}" th:text="${c}"></option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Expiration Date (Optional)</label>
                            <input type="date" name="expiryDate" class="form-control">
                        </div>
                        <div class="form-group" style="grid-column: span 2;">
                            <label class="form-label">Detailed Notice Text</label>
                            <textarea name="description" class="form-control" rows="4" placeholder="Enter complete circular text..." required></textarea>
                        </div>
                    </div>
                    <div style="margin-top: 1.25rem;">
                        <button type="submit" class="btn btn-primary">Publish Circular</button>
                    </div>
                </form>
            </div>

            <!-- Notices Table -->
            <div class="table-container">
                <div class="table-header">
                    <h2 class="table-title">Active Notices (<span th:text="${#lists.size(notices)}">0</span>)</h2>
                </div>
                <table class="custom-table">
                    <thead>
                        <tr>
                            <th>Published</th>
                            <th>Category</th>
                            <th>Title & Details</th>
                            <th>Issued By</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="n : ${notices}">
                            <td style="font-family: var(--font-mono);" th:text="${n.publishedDate}">2026-10-01</td>
                            <td>
                                <span class="badge"
                                      th:classappend="${n.category.name() == 'Emergency' ? 'badge-danger' : (n.category.name() == 'Examination' ? 'badge-warning' : 'badge-info')}"
                                      th:text="${n.category}">Examination</span>
                            </td>
                            <td>
                                <strong th:text="${n.title}">Midterm Exam</strong>
                                <p style="font-size: 0.8rem; color: var(--text-secondary); margin-top: 0.25rem;" th:text="${n.description}">Description text...</p>
                            </td>
                            <td th:text="${n.createdBy}">Dean Academics</td>
                            <td>
                                <form th:action="@{'/admin/notices/delete/' + ${n.id}}" method="post" style="display:inline;" onsubmit="return confirm('Confirm deleting notice?');">
                                    <button type="submit" class="btn btn-danger btn-sm">Delete</button>
                                </form>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>
</div>
</body>
</html>
