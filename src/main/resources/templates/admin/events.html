<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Management | Smart Campus</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="app-layout">
    <div th:replace="~{layout/fragments :: admin-sidebar}"></div>

    <div class="main-wrapper">
        <div th:replace="~{layout/fragments :: topbar('Campus Events & Conclaves')}"></div>

        <main class="content-body">
            <div th:if="${successMessage}" class="alert-banner alert-success" th:text="${successMessage}"></div>
            <div th:if="${errorMessage}" class="alert-banner alert-error" th:text="${errorMessage}"></div>

            <!-- Create Event Form -->
            <div class="form-panel">
                <h2 style="font-size: 1.1rem; margin-bottom: 1rem;">Organize Campus Event</h2>
                <form th:action="@{/admin/events/add}" method="post">
                    <div class="form-grid">
                        <div class="form-group" style="grid-column: span 2;">
                            <label class="form-label">Event Title</label>
                            <input type="text" name="title" class="form-control" placeholder="e.g. AI & Robotics Symposium 2026" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Event Date</label>
                            <input type="date" name="eventDate" class="form-control" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Start Time</label>
                            <input type="time" name="startTime" class="form-control" value="10:00" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label">End Time</label>
                            <input type="time" name="endTime" class="form-control" value="16:00" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Location / Venue</label>
                            <input type="text" name="location" class="form-control" placeholder="e.g. Main Auditorium" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Organizer Department / Club</label>
                            <input type="text" name="organizer" class="form-control" placeholder="e.g. Department of CSE" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Seat Capacity Limit</label>
                            <input type="number" name="capacity" class="form-control" min="1" max="1000" value="100" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Registration Deadline</label>
                            <input type="date" name="registrationDeadline" class="form-control" required>
                        </div>
                        <div class="form-group" style="grid-column: span 2;">
                            <label class="form-label">Event Description & Agenda</label>
                            <textarea name="description" class="form-control" rows="3" placeholder="Provide event details, speakers, and schedule..." required></textarea>
                        </div>
                    </div>
                    <div style="margin-top: 1.25rem;">
                        <button type="submit" class="btn btn-primary">Create Event</button>
                    </div>
                </form>
            </div>

            <!-- Events Table -->
            <div class="table-container">
                <div class="table-header">
                    <h2 class="table-title">Scheduled Campus Events</h2>
                </div>
                <table class="custom-table">
                    <thead>
                        <tr>
                            <th>Date & Time</th>
                            <th>Event Title</th>
                            <th>Location</th>
                            <th>Organizer</th>
                            <th>Seats (Booked / Cap)</th>
                            <th>Status</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="e : ${events}">
                            <td style="font-family: var(--font-mono);">
                                <span th:text="${e.eventDate}">2026-10-15</span><br>
                                <small style="color: var(--text-muted);" th:text="${e.startTime + ' - ' + e.endTime}">10:00 - 16:00</small>
                            </td>
                            <td>
                                <strong th:text="${e.title}">Tech Fest</strong>
                                <p style="font-size: 0.8rem; color: var(--text-secondary);" th:text="${e.description}">Desc...</p>
                            </td>
                            <td th:text="${e.location}">Main Auditorium</td>
                            <td th:text="${e.organizer}">CSE Dept</td>
                            <td>
                                <strong th:text="${e.registeredCount + ' / ' + e.capacity}">13 / 100</strong>
                                <span style="font-size: 0.75rem; color: var(--text-muted); display: block;" th:text="${e.remainingSeats + ' seats left'}">87 left</span>
                            </td>
                            <td>
                                <span class="badge" th:classappend="${e.isFull() ? 'badge-danger' : 'badge-success'}"
                                      th:text="${e.isFull() ? 'Full' : 'Open'}">Open</span>
                            </td>
                            <td>
                                <div style="display: flex; gap: 0.35rem; align-items: center;">
                                    <a th:href="@{'/admin/events/' + ${e.id} + '/attendees'}" class="btn btn-outline btn-sm">Attendees</a>
                                    <form th:action="@{'/admin/events/delete/' + ${e.id}}" method="post" style="display:inline;" onsubmit="return confirm('Confirm deleting event?');">
                                        <button type="submit" class="btn btn-danger btn-sm">Delete</button>
                                    </form>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>
</div>
</body>
</html>
