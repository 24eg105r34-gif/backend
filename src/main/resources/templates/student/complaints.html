<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Raise & Track Complaints | Smart Campus</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="app-layout">
    <div th:replace="~{layout/fragments :: student-sidebar}"></div>

    <div class="main-wrapper">
        <div th:replace="~{layout/fragments :: topbar('Student Grievance Redressal')}"></div>

        <main class="content-body">
            <div th:if="${successMessage}" class="alert-banner alert-success" th:text="${successMessage}"></div>
            <div th:if="${errorMessage}" class="alert-banner alert-error" th:text="${errorMessage}"></div>

            <!-- Raise Complaint Form -->
            <div class="form-panel">
                <h2 style="font-size: 1.1rem; margin-bottom: 1rem;">Raise Campus Complaint Ticket</h2>
                <form th:action="@{/student/complaints/raise}" method="post">
                    <div class="form-grid">
                        <div class="form-group">
                            <label class="form-label">Category</label>
                            <select name="category" class="form-control" required>
                                <option th:each="c : ${categories}" th:value="${c}" th:text="${c}"></option>
                            </select>
                        </div>
                        <div class="form-group" style="grid-column: span 2;">
                            <label class="form-label">Subject / Issue Summary</label>
                            <input type="text" name="subject" class="form-control" placeholder="e.g. Broken bench in Seminar Hall B" required>
                        </div>
                        <div class="form-group" style="grid-column: span 3;">
                            <label class="form-label">Detailed Description</label>
                            <textarea name="description" class="form-control" rows="3" placeholder="Provide complete location details and problem description..." required></textarea>
                        </div>
                    </div>
                    <div style="margin-top: 1.25rem;">
                        <button type="submit" class="btn btn-primary">Submit Grievance Ticket</button>
                    </div>
                </form>
            </div>

            <!-- Track Complaints Table -->
            <div class="table-container">
                <div class="table-header">
                    <h2 class="table-title">My Grievance Tickets (<span th:text="${#lists.size(complaints)}">0</span>)</h2>
                </div>
                <table class="custom-table">
                    <thead>
                        <tr>
                            <th>Ticket ID</th>
                            <th>Filed Date</th>
                            <th>Category</th>
                            <th>Subject & Issue</th>
                            <th>Status</th>
                            <th>Admin Response</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:if="${#lists.isEmpty(complaints)}">
                            <td colspan="7" style="text-align: center; color: var(--text-muted); padding: 2rem;">You haven't filed any complaints yet.</td>
                        </tr>
                        <tr th:each="c : ${complaints}">
                            <td style="font-family: var(--font-mono); font-weight: 700;" th:text="'#TKT-' + ${c.id}">#TKT-1</td>
                            <td style="font-family: var(--font-mono);" th:text="${#temporals.format(c.createdAt, 'dd MMM yyyy')}">2026-10-01</td>
                            <td><span class="badge badge-muted" th:text="${c.category}">Laboratory</span></td>
                            <td>
                                <strong th:text="${c.subject}">Subject</strong>
                                <p style="font-size: 0.8rem; color: var(--text-secondary); margin-top: 0.25rem;" th:text="${c.description}">Desc...</p>
                            </td>
                            <td>
                                <span class="badge"
                                      th:classappend="${c.status.name() == 'RESOLVED' ? 'badge-success' : (c.status.name() == 'PENDING' ? 'badge-warning' : (c.status.name() == 'IN_PROGRESS' ? 'badge-info' : 'badge-danger'))}"
                                      th:text="${c.status}">PENDING</span>
                            </td>
                            <td style="max-width: 250px;">
                                <div th:if="${c.adminResponse != null}" style="font-size: 0.825rem; color: var(--text-primary);">
                                    <span th:text="${c.adminResponse}">Resolution note...</span>
                                    <small th:if="${c.resolvedAt != null}" style="display: block; color: var(--text-muted); font-family: var(--font-mono); margin-top: 0.25rem;"
                                           th:text="'Resolved: ' + ${#temporals.format(c.resolvedAt, 'dd MMM yyyy')}">Date</small>
                                </div>
                                <span th:unless="${c.adminResponse != null}" style="color: var(--text-muted); font-size: 0.8rem;">Pending administrator review</span>
                            </td>
                            <td>
                                <div th:if="${c.status.name() == 'PENDING'}">
                                    <form th:action="@{/student/complaints/cancel}" method="post" onsubmit="return confirm('Withdraw this grievance ticket?');">
                                        <input type="hidden" name="complaintId" th:value="${c.id}">
                                        <button type="submit" class="btn btn-outline btn-sm" style="color: var(--danger); border-color: var(--danger);">Withdraw</button>
                                    </form>
                                </div>
                                <span th:unless="${c.status.name() == 'PENDING'}" style="color: var(--text-muted); font-size: 0.75rem;">Processed</span>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>
</div>
</body>
</html>
