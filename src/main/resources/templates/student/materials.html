<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course Study Materials | Smart Campus</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="app-layout">
    <div th:replace="~{layout/fragments :: student-sidebar}"></div>

    <div class="main-wrapper">
        <div th:replace="~{layout/fragments :: topbar('Study Materials & Reference Handouts')}"></div>

        <main class="content-body">
            <div class="table-container">
                <div class="table-header">
                    <h2 class="table-title">Available Course Resources (<span th:text="${#lists.size(materials)}">0</span>)</h2>
                </div>
                <table class="custom-table">
                    <thead>
                        <tr>
                            <th>Subject</th>
                            <th>Resource Title & Description</th>
                            <th>Format</th>
                            <th>Instructor</th>
                            <th>Action / Download</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:if="${#lists.isEmpty(materials)}">
                            <td colspan="5" style="text-align: center; color: var(--text-muted); padding: 2rem;">No study materials posted yet for your semester courses.</td>
                        </tr>
                        <tr th:each="m : ${materials}">
                            <td><span class="badge badge-muted" th:text="${m.subject.subjectCode}">CS501</span></td>
                            <td>
                                <strong th:text="${m.title}">Unit 3: CPU Scheduling</strong>
                                <p style="font-size: 0.8rem; color: var(--text-secondary); margin-top: 0.25rem;" th:text="${m.description}">Description...</p>
                            </td>
                            <td><span class="badge badge-info" th:text="${m.fileType}">PDF</span></td>
                            <td th:text="${m.faculty.name}">Prof. Alok Sharma</td>
                            <td>
                                <a th:href="${m.filePath}" class="btn btn-outline btn-sm" download th:text="'Download ' + ${m.fileName}">Download</a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>
</div>
</body>
</html>
