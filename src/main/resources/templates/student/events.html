<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Events & Registration | Smart Campus</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="app-layout">
    <div th:replace="~{layout/fragments :: student-sidebar}"></div>

    <div class="main-wrapper">
        <div th:replace="~{layout/fragments :: topbar('Campus Events & Conclaves')}"></div>

        <main class="content-body">
            <div th:if="${successMessage}" class="alert-banner alert-success" th:text="${successMessage}"></div>
            <div th:if="${errorMessage}" class="alert-banner alert-error" th:text="${errorMessage}"></div>

            <div class="table-container">
                <div class="table-header">
                    <h2 class="table-title">Upcoming Events & Registration</h2>
                </div>

                <div style="padding: 1.5rem; display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 1.5rem;">
                    <div th:if="${#lists.isEmpty(events)}" style="grid-column: 1 / -1; text-align: center; color: var(--text-muted); padding: 2rem;">
                        No upcoming campus events currently scheduled.
                    </div>

                    <div th:each="e : ${events}" class="card" style="display: flex; flex-direction: column; justify-content: space-between;">
                        <div>
                            <div class="card-header">
                                <span class="badge badge-muted" th:text="${e.organizer}">Organizer</span>
                                <span class="badge" th:classappend="${registeredEventIds.contains(e.id) ? 'badge-success' : (e.isFull() ? 'badge-danger' : 'badge-info')}"
                                      th:text="${registeredEventIds.contains(e.id) ? 'REGISTERED' : (e.isFull() ? 'HOUSEFULL' : 'SEATS OPEN')}">OPEN</span>
                            </div>

                            <h3 class="card-title" style="margin-bottom: 0.5rem;" th:text="${e.title}">TECH FEST 2026</h3>
                            <p class="card-body" th:text="${e.description}">Conclave details...</p>

                            <div style="background: var(--bg-secondary); border: 1px solid var(--border-color); border-radius: var(--radius-sm); padding: 0.75rem; margin-bottom: 1rem; font-size: 0.85rem;">
                                <div><strong>Date:</strong> <span th:text="${#temporals.format(e.eventDate, 'dd MMMM yyyy')}">15 October 2026</span></div>
                                <div><strong>Time:</strong> <span th:text="${e.startTime + ' - ' + e.endTime}">09:30 - 17:30</span></div>
                                <div><strong>Location:</strong> <span th:text="${e.location}">Main Auditorium</span></div>
                                <div><strong>Seats:</strong> <span style="font-weight: 700; color: var(--accent-white);" th:text="${e.remainingSeats + ' / ' + e.capacity + ' Remaining'}">87 / 100</span></div>
                            </div>
                        </div>

                        <div>
                            <div th:if="${registeredEventIds.contains(e.id)}" style="display: flex; flex-direction: column; gap: 0.5rem;">
                                <button type="button" class="btn btn-outline" style="width: 100%; border-color: var(--success); color: var(--success); cursor: default;">
                                    ✓ Registration Confirmed
                                </button>
                                <form th:action="@{/student/events/cancel}" method="post" onsubmit="return confirm('Cancel registration for this event?');">
                                    <input type="hidden" name="eventId" th:value="${e.id}">
                                    <button type="submit" class="btn btn-outline btn-sm" style="width: 100%; color: var(--danger); border-color: var(--danger);">Cancel Registration</button>
                                </form>
                            </div>
                            <div th:unless="${registeredEventIds.contains(e.id)}">
                                <div th:if="${e.isFull()}">
                                    <button type="button" class="btn btn-outline" style="width: 100%; opacity: 0.5;" disabled>Event Full</button>
                                </div>
                                <div th:unless="${e.isFull()}">
                                    <form th:action="@{/student/events/register}" method="post">
                                        <input type="hidden" name="eventId" th:value="${e.id}">
                                        <button type="submit" class="btn btn-primary" style="width: 100%;">REGISTER FOR EVENT</button>
                                    </form>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>
</body>
</html>
