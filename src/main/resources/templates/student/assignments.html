<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Coursework & Assignments | Smart Campus</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="app-layout">
    <div th:replace="~{layout/fragments :: student-sidebar}"></div>

    <div class="main-wrapper">
        <div th:replace="~{layout/fragments :: topbar('Assignments & Submission Portal')}"></div>

        <main class="content-body">
            <div th:if="${successMessage}" class="alert-banner alert-success" th:text="${successMessage}"></div>
            <div th:if="${errorMessage}" class="alert-banner alert-error" th:text="${errorMessage}"></div>

            <div class="table-container">
                <div class="table-header">
                    <h2 class="table-title">Course Assignments (<span th:text="${#lists.size(assignments)}">0</span>)</h2>
                </div>
                <table class="custom-table">
                    <thead>
                        <tr>
                            <th>Course</th>
                            <th>Assignment & Instructions</th>
                            <th>Deadline</th>
                            <th>Max Marks</th>
                            <th>Submission Status</th>
                            <th>Action / Deliverable</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:if="${#lists.isEmpty(assignments)}">
                            <td colspan="6" style="text-align: center; color: var(--text-muted); padding: 2rem;">No assignments currently assigned.</td>
                        </tr>
                        <tr th:each="a : ${assignments}">
                            <td><span class="badge badge-muted" th:text="${a.subject.subjectCode}">CS501</span></td>
                            <td>
                                <strong th:text="${a.title}">Process Scheduling</strong>
                                <p style="font-size: 0.8rem; color: var(--text-secondary); margin-top: 0.25rem;" th:text="${a.description}">Instructions...</p>
                            </td>
                            <td style="font-family: var(--font-mono);" th:text="${#temporals.format(a.deadline, 'dd MMM yyyy, hh:mm a')}">Date</td>
                            <td th:text="${a.maxMarks}">25.0</td>
                            <td>
                                <div th:if="${submissionMap[a.id] != null}">
                                    <span class="badge"
                                          th:classappend="${submissionMap[a.id].status.name() == 'REVIEWED' ? 'badge-success' : (submissionMap[a.id].status.name() == 'LATE' ? 'badge-danger' : 'badge-info')}"
                                          th:text="${submissionMap[a.id].status}">SUBMITTED</span>
                                    <div th:if="${submissionMap[a.id].marksObtained != null}" style="margin-top: 0.25rem; font-size: 0.8rem;">
                                        Score: <strong th:text="${submissionMap[a.id].marksObtained + ' / ' + a.maxMarks}">23/25</strong>
                                    </div>
                                    <div th:if="${submissionMap[a.id].feedback != null}" style="font-size: 0.75rem; color: var(--text-secondary);"
                                         th:text="'Feedback: ' + ${submissionMap[a.id].feedback}">Feedback</div>
                                </div>
                                <div th:unless="${submissionMap[a.id] != null}">
                                    <span class="badge badge-warning">PENDING</span>
                                </div>
                            </td>
                            <td style="min-width: 250px;">
                                <form th:action="@{/student/assignments/submit}" method="post">
                                    <input type="hidden" name="assignmentId" th:value="${a.id}">
                                    <div style="display: flex; flex-direction: column; gap: 0.4rem;">
                                        <textarea name="submissionText" class="form-control" rows="2" style="font-size: 0.8rem;"
                                                  placeholder="Paste your solution or Github repository link..." required></textarea>
                                        <input type="text" name="fileName" class="form-control" style="font-size: 0.8rem; padding: 0.35rem 0.5rem;"
                                               placeholder="Attached file (e.g. solution.zip)">
                                        <button type="submit" class="btn btn-primary btn-sm">
                                            <span th:text="${submissionMap[a.id] != null ? 'Resubmit Solution' : 'Submit Assignment'}">Submit</span>
                                        </button>
                                    </div>
                                </form>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>
</div>
</body>
</html>
